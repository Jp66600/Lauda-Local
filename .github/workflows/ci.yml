name: CI

# O mesmo que se pede num pull request: lint, tipos e a suíte.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,docs]"

      - name: ruff
        run: ruff check src tests scripts

      # O mypy analisa um sistema operacional de cada vez: código dentro de
      # `if sys.platform == "win32"` ele simplesmente não lê quando roda no
      # Linux. Como este projeto é feito no Windows e a checagem roda aqui, as
      # duas metades passariam despercebidas cada uma na sua vez — foi o que
      # aconteceu com o `winreg` da detecção de placa de vídeo. Os três
      # sistemas, então.
      - name: mypy (Linux)
        run: mypy src --platform linux

      - name: mypy (Windows)
        run: mypy src --platform win32

      - name: mypy (macOS)
        run: mypy src --platform darwin

  testes:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Sem ffmpeg, metade da suíte se pula sozinha — e o que ela garante é
      # justamente a leitura de mídia.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,docs]"

      # A janela é criada e escondida (withdraw); no Linux ela ainda precisa de
      # um servidor gráfico, senão os testes de interface se pulam.
      - name: pytest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests -q

      - name: pytest (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests -q
